# Squash merges use the PR title as the commit message, so it must follow
# Conventional Commits (release-plz derives versions and the changelog from it).
# Actions are pinned to commit SHAs by pinact (`mise run ci-pin`).
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
