# Release PRs and releases (docs/releasing.md, "How it works").
# On every push to develop:
# - release-pr: opens or updates the release PR into develop and syncs
#   herdr-plugin.toml's version on it;
# - release: when the push is a merged release PR, tags vX.Y.Z and
#   creates a draft release; then build (build.yml), publish (undraft)
#   and promote (fast-forward master to the tag).
# Jobs that write to the repository use the release App's token: CI runs
# on what it pushes, and the master and tag rulesets let only the App
# through.
# Actions are pinned to commit SHAs by pinact (`mise run ci-pin`).
name: release-plz

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ fromJSON(steps.release-plz.outputs.releases || '[]')[0].tag }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: false
      - id: release-plz
        uses: release-plz/action@18641b6c63063cc5ff8786ebf69cd57e8541bae1 # v0.5.140
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  build:
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  # Only after every target is uploaded: a failed build leaves a draft.
  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "$TAG" --draft=false --latest
        env:
          TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # master follows published releases only, so Herdr installs and the
  # marketplace never see a version without binaries. force=false: a
  # fast-forward or nothing.
  promote:
    needs: [release, publish]
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - run: |
          sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          gh api -X PATCH "repos/$GH_REPO/git/refs/heads/master" -f sha="$sha" -F force=false
          echo "master -> $TAG ($sha)"
        env:
          TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}

  # After release, so a release just made counts as the latest version.
  release-pr:
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: false
      - id: release-plz
        uses: release-plz/action@18641b6c63063cc5ff8786ebf69cd57e8541bae1 # v0.5.140
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      # release-plz bumps only Cargo.toml; the marketplace reads the manifest.
      - name: Sync herdr-plugin.toml version
        if: steps.release-plz.outputs.pr != '{}' && steps.release-plz.outputs.pr != ''
        env:
          BRANCH: ${{ fromJSON(steps.release-plz.outputs.pr).head_branch }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # gh's credential helper reads GH_TOKEN from this step's
          # environment, so the token stays out of .git/config.
          gh auth setup-git
          git fetch origin "$BRANCH"
          git switch -C "$BRANCH" "origin/$BRANCH"
          scripts/sync-version.sh
          if git diff --quiet herdr-plugin.toml; then
            echo "herdr-plugin.toml already in sync"
            exit 0
          fi
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git -c user.name="${APP_SLUG}[bot]" \
            -c user.email="${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" \
            commit -m "chore: sync herdr-plugin.toml version" herdr-plugin.toml
          git push origin "$BRANCH"
