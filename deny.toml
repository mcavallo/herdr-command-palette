# cargo-deny: supply-chain checks run by `mise run lint` and CI.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Release targets.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]

[advisories]
# RustSec advisories: vulnerabilities and unsound crates fail; unmaintained
# crates are reported for direct dependencies only.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Licenses that can be combined into a GPL-3.0-or-later binary.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "GPL-3.0-or-later",
]
confidence-threshold = 0.9
# The allow-list anticipates planned dependencies; unused entries are fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
